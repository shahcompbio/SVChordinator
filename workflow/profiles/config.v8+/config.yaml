# Snakemake 9.x compatible profile configuration
# For SLURM cluster execution

# Use the SLURM executor plugin
# Install with: pip install snakemake-executor-plugin-slurm
executor: slurm

# SLURM-specific settings
default-resources:
  - partition=componc_cpu
  - mem_mb=20000
  - time=180
  - slurm_account=default
  - tmpdir='/data1/shahs3/users/preskaa/tmp'

# Job submission settings
jobs: 300
max-jobs-per-second: 3
max-status-checks-per-second: 1

# Retry and error handling
retries: 0  # temporary - was restart-times in v7
keep-going: True
rerun-incomplete: True

# Local execution settings
local-cores: 1
latency-wait: 60

# Output settings
printshellcmds: True
show-failed-logs: True

# Scheduling
scheduler: greedy

# Software deployment
software-deployment-method: apptainer

# SLURM job customization
set-threads:
  - "*=cpus-per-task"
set-resources:
  - "*:slurm_partition=partition"
  - "*:mem_mb=mem"
  - "*:runtime=time"

# Log directory pattern
slurm-logdir: "logs/{date}/{rule}"
